# Minimal freshclam config for the in-container (Linux) ClamAV scan path.
#
# Debian's default /etc/clamav/freshclam.conf sets UpdateLogFile, which
# freshclam locks/writes to regardless of --stdout -- the orca user can't
# always get a clean lock on it, and we don't need a log file on disk since
# output is already captured from stdout by the caller. This file
# deliberately omits UpdateLogFile (default: disabled) to avoid that
# entirely, and points the database at ORCA_CLAM_DB_DIR (/var/lib/clamav)
# via --datadir on the command line rather than duplicating it here.

DatabaseMirror database.clamav.net
