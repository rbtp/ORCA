name: Windows.Custom.KapeFiles
parameters:
  - name: TCode
    default: "Unknown"
  - name: TargetPath
    default: ""
  - name: Device
    default: "C:/"

sources:
  - query: |
      -- This is the most stable way to handle the glob in 0.76.1
      SELECT 
          FullPath, 
          Size, 
          Mtime, 
          TCode
      FROM glob(globs=Device + TargetPath)