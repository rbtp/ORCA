name: orcaweb

services:
  orca-backend:
    # Fixed image name: the offline kit loads prebuilt images under this name,
    # and compose must use them as-is whatever the project is called (without
    # this, compose derives the name from the project and builds instead,
    # which needs internet). `docker compose build` still tags this name.
    image: orcaweb-orca-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orca-backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      # Velociraptor GUI (Options > Velociraptor, admin-only). Started on
      # demand, protected by its own login; nothing listens here otherwise.
      - "8889:8889"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@orca-postgres:5432/orca_db
      - JWT_SECRET=${JWT_SECRET}
      - TLS_CERT_PATH=/app/certs/orca.crt
      - TLS_KEY_PATH=/app/certs/orca.key
      - ORCA_SERVER_URL=${ORCA_SERVER_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost}
      - CASES_DIR=${CASES_DIR:-}
      - ORCA_DATA_ROOT=/app/evidence
      - VT_API_KEY=${VT_API_KEY:-}
      # Optional SMTP for enrollment/reset links (email_utils.py) -- all
      # empty by default, which disables email and falls back to showing
      # the link in the admin UI.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      # Optional first-boot admin (bootstrap_admin.py) -- only used when the
      # users table is empty; unset = random password logged once.
      - ORCA_BOOTSTRAP_ADMIN_USERNAME=${ORCA_BOOTSTRAP_ADMIN_USERNAME:-admin}
      - ORCA_BOOTSTRAP_ADMIN_INITIALS=${ORCA_BOOTSTRAP_ADMIN_INITIALS:-ADM}
      - ORCA_BOOTSTRAP_ADMIN_PASSWORD=${ORCA_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - orca-certs:/app/certs          # shared TLS certs (writable — backend generates on first boot)
      - ./backend/bin:/app/bin:ro
      - ./agent:/app/agent:ro          # orca_agent.py, served to remote targets via /api/agent/download/orca_agent.py
      - ./migrations:/app/migrations:ro  # applied automatically at startup by migrate.py
      - orca-evidence:/app/evidence
      - ${MEMORY_DUMPS_DIR:-./memory-dumps}:/app/memory-dumps:ro  # host dir for memory images (set MEMORY_DUMPS_DIR in .env)
      - ${CASES_DIR:-./cases}:/app/cases:rw                       # investigation working dirs (set CASES_DIR in .env)
    tmpfs:
      # Uploaded behavioral-analysis samples are live malware -- noexec/nosuid/nodev
      # is kernel-enforced, unlike file permission bits alone (644 already isn't
      # executable, but that doesn't stop a bug or a compromised process from
      # chmod +x-ing something and running it). tmpfs also means the samples never
      # touch the host disk or the container's persistent layer at all -- gone on
      # container stop, not just on job delete.
      - /tmp/orca_behavioral:noexec,nosuid,nodev,mode=1770,uid=1000,gid=0,size=4g
    networks:
      - orca-net
    depends_on:
      orca-postgres:
        condition: service_healthy

  orca-frontend:
    # Fixed image name: the offline kit loads prebuilt images under this name,
    # and compose must use them as-is whatever the project is called (without
    # this, compose derives the name from the project and builds instead,
    # which needs internet). `docker compose build` still tags this name.
    image: orcaweb-orca-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: orca-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - orca-certs:/etc/nginx/certs:ro  # shared TLS certs (read-only — backend owns writes)
    networks:
      - orca-net
    depends_on:
      - orca-backend

  orca-postgres:
    image: postgres:15
    container_name: orca-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=orca_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - orca-postgres-data:/var/lib/postgresql/data
      # Postgres's own official image runs any *.sql it finds here exactly
      # once -- only during a genuinely fresh volume's first initialization,
      # never again on a normal restart (confirmed live). Without this,
      # nothing ever creates the schema on a brand-new volume at all --
      # confirmed live the hard way: a fresh install got a backend crash
      # loop (AttributeError: mitre_groups) because reflection found zero
      # tables. schema.sql is pure DDL (no seed data), so re-running it here
      # is exactly as safe as running it once.
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Reference data (MITRE analytics, artifact library, threat
      # attribution...), loaded once right after the schema on a fresh volume.
      - ./backend/initdb/02-seed-data.sh:/docker-entrypoint-initdb.d/02-seed-data.sh:ro
      - ./seed_data:/seed_data:ro
    networks:
      - orca-net
    healthcheck:
      # A fresh volume's first-ever boot runs initdb + creates the DB, which
      # can take well past `depends_on`'s plain container-started check --
      # orca-backend used to race this (its own DB-connect retry logic could
      # exhaust its budget before Postgres was actually ready, crash, and
      # get restarted by `restart: unless-stopped` -- a "goes down and back
      # up once on first boot" symptom that only shows up on a truly fresh
      # volume, never on one that's already initialized). depends_on above
      # now waits for this healthcheck instead of racing it.
      # -h 127.0.0.1 (TCP), not the default Unix socket: while initdb scripts
      # (schema + seed data) run, Postgres serves a temporary socket-only
      # instance, so a socket check reports "ready" before the backend can
      # actually connect over the network.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d orca_db"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

networks:
  orca-net:
    driver: bridge

volumes:
  orca-postgres-data:
  orca-evidence:
  orca-certs:         # shared ECDSA P-256 cert/key between backend and frontend

# ─── EXISTING INSTALLATION NOTE ───────────────────────────────────────────────
# If you already have a standalone orca-postgres container running on this machine:
#
#   1. Do NOT run `docker compose up orca-postgres` — it will conflict.
#   2. Connect the existing container to orca-net after first compose run:
#        docker network create orca-net 2>/dev/null || true
#        docker network connect orca-net orca-postgres
#   3. Then start only the backend and frontend:
#        docker compose up -d orca-backend orca-frontend
#
# See DEPLOY.md for full migration instructions.
#
# ─── TLS NOTE ────────────────────────────────────────────────────────────────
# On first boot, the backend entrypoint auto-generates a self-signed ECDSA P-256
# cert and writes it to the orca-certs volume. The frontend nginx waits for that
# cert before starting. No manual cert files needed.
#
# Browser security warning on first visit is expected for self-signed certs.
# Analysts click "proceed anyway" once; subsequent visits are seamless.
