server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/orca.crt;
    ssl_certificate_key /etc/nginx/certs/orca.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 200m was rejecting real evidence outright -- confirmed live 2026-09-01
    # that a single technique's raw JSONL (MFT, full drive) can legitimately
    # be 1GB+ on a busy volume; nginx returning 413 for that meant the
    # primary MFT ingest could never succeed at all, forcing the capped
    # 1000-row fallback query every time. Not scoped to /api/ingest/ alone
    # since this was already server-level for every route.
    client_max_body_size 4096m;

    location /api/ {
        # A bare hostname in proxy_pass is resolved ONCE at nginx startup and
        # cached for the life of the worker process -- confirmed live
        # 2026-08-18: every time orca-backend gets recreated (a rebuild, a
        # restart) it gets a new Docker-assigned IP, and nginx kept retrying
        # the stale one forever ("Host is unreachable"), breaking login and
        # every other API call until nginx itself was manually restarted.
        # Docker's embedded DNS (127.0.0.11) plus a variable in proxy_pass
        # forces nginx to actually re-resolve on this TTL instead of caching
        # indefinitely.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream "https://orca-backend:8000";
        proxy_pass $backend_upstream;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/orca.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
